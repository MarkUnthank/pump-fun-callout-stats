name: Release extension

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify release version
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const manifest=JSON.parse(fs.readFileSync("manifest.json")); const pkg=JSON.parse(fs.readFileSync("package.json")); if (`v${manifest.version}` !== process.env.GITHUB_REF_NAME || pkg.version !== manifest.version) throw new Error("Tag, manifest and package versions must match");'
      - run: npm ci --ignore-scripts
      - run: npm run package
      - name: Create checksum
        working-directory: dist
        run: sha256sum callout-stats.zip > SHA256SUMS.txt
      - name: Publish install package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/callout-stats.zip dist/SHA256SUMS.txt --verify-tag --title "Callout Stats $GITHUB_REF_NAME" --generate-notes --notes-file .github/release-notes.md
